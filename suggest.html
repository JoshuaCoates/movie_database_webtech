<!-- Updated top header of suggest.html to reflect the same informationa and styling as index.html -->
<html>
	<html lang="en-GB">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Suggest A Movie | Movie Database</title>
		<link rel="stylesheet" href="css/styles.css">
		<script src="js/api.js" defer></script>
		<script src="js/main.js" defer></script>
	</head>

<!-- Updated page using snippets from all other pages to match layout and uniformity across different pages. -->
<!-- Button for skipping to main content once suggestion has been made. -->

	<body>
		<a href="#main" class="link-skip">Skip To Main Content</a>

		<header class="site-header">
			<a href="index.html" class="logo">
				<img src="images/logo.svg" alt="" width="32" height="32">
				Movie Database
			</a>
			<button class="navigation-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">Menu</button>
			
<!-- As with all other pages, buttons now in top right corner for suggestions and for search. -->			
			
			<nav id="site-navigation" aria-label="Main">
				<ul>
					<li><a href="index.html">Search</a></li>
					<li><a href="suggest.html" aria-current="page">Suggest A Movie</a></li>
				</ul>
			</nav>
		</header>

<!-- Suggestion boxes for input and suggestion of a Movie that isn't included in the database when searching. -->

		<main id="main">
  			<h1>Suggest A Movie</h1>

<!-- Name label -->			
  			<form id="suggest-form" novalidate>
    				<label for="name">Your Name</label>
    				<input type="text" id="name" name="name" required maxlength="70"
					autocomplete="name" aria-describedby="name-error">
				<p id="name-error" class="error-message"></p>

<!-- Email label -->

    				<label for="email">Email</label>
   				<input type="email" id="email" name="email" required
					autocomplete="email" aria-describedby="email-error">
				<p id="email-error" class="error-message"></p>

<!-- Movie Title label -->

    				<label for="movie-name">Movie Title</label>
    				<input type="text" id="movie-name" name="movieTitle" required maxlength="100"
					aria-describedby="movie-name-error">
				<p id="movie-name-error" class="error-message"></p>

<!-- Release Year label -->

    				<label for="year">Release Year</label>
    				<input type="number" id="year" name="year" min="1900" max="2026"
					inputmode="numeric" aria-describedby="year-hint year-error">
				<p id="year-hint" class="hint">Optional</p>
				<p id="year-error" class="error-message"></p>

<!-- Genre label -->
<!-- Gives option for set genre rather than pulling from Genre list that is coming in from TMDB API -->

    				<label for="suggest-genre">Genre</label>
    				<select id="suggest-genre" name="genre" required aria-describedby="suggest-genre-error">
					<option value="">Choose A Genre</option>
      					<option value="action">Action</option>
      					<option value="comedy">Comedy</option>
      					<option value="drama">Drama</option>
					<option value="horror">Horror</option>
					<option value="sci-fi">Sci-Fi</option>
    				</select>
				<p id="suggest-genre-error" class="error-message"></p>

<!-- Why Should it be added label -->
<!-- Limited characters that will show an error message if the character count is exceeded. This applies also for minimum character length -->

    				<label for="reason">Why Should It Be Added?</label>
    				<textarea id="reason" name="reason" rows="4" required minlength="20" maxlength="300"
					aria-describedby="reason-count reason-error"></textarea>
				<p id="reason-count" class="hint">0 of 300 characters</p>
				<p id="reason-error" class="error-message"></p>


<!-- Checkbox to confirm that there has been consent for the movie suggestion to be shown -->

				<div class="consent">
    					<input type="checkbox" id="consent" name="consent" required aria-describedby="consent-error">
					<label for="consent">I agree to my suggestion being shown</label>
				</div>
				<p id="consent-error" class="error-message"></p>

<!-- Send button for submitting the information that has been input into the suggestion form -->

    				<button type="submit">Send</button>
  			</form>

			<p id="confirmation" class="confirmation" role="status" hidden></p>
		</main>

<!-- Site footer the same as the other pages to show owner, information origin and maintain uniformity across the pages. -->

		<footer class="site-footer">
			<p>&copy; 2026 Josh Coates. Film data from TMDB + OMDB.</p>
		</footer>
	</body>
</html>
