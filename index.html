<!-- Header added to give correct tile at top of page when loading page in browser tabs -->
<html>
	<html lang="en-GB">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Search Movies | Movie Database</title>
		<link rel="stylesheet" href="css/styles.css">
		<script src="js/api.js" defer></script>
		<script src="js/main.js" defer></script>
	</head>

<!-- Body allows for logo alognside headers required for navigation bar along top level.-->
<!-- https://www.w3.org/TR/using-aria/ -->

	<body>
		<a href="#main" class="link-skip">Skip To Main Content</a>

		<header class="site-header">
			<a href="index.html" class="logo">
				<img src="images/logo.svg" alt="" width="32" height="32">
				Movie Database
			</a>
			<button class="navigation-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">Menu</button>
			<nav id="site-navigation" aria-label="Main">
				<ul>
					<li><a href="index.html" aria-current="page">Search</a></li>
					<li><a href="suggest.html">Suggest A Movie</a></li>
				</ul>
			</nav>
		</header>

<!-- Setting out for buttons and text input to be able to search for movie on first page following loading.-->
		
		<main id="main">
			<img src="images/logo.svg" alt="" class="hero-logo" width="96" height="96">
			<h1>Find Your Next Movie</h1>

<!-- First box required for searching for movie. Named Movie Title -->

			<form id="search-form">
				<label for="title">Movie Title</label>
				<input type="search" id="title" name="title" required minlength="2">

<!-- Genre drop down box. This will be populated with pulling from TMDB. -->

				<label for="genre">Genre</label>
				<select id="genre" name="genre">
					<option value="">Any Genre</option>
				</select>

<!-- Sort by options. Either via sorting the titles Alphabetically or by the rating that is given to them -->

				<fieldset>
					<legend>Sort By</legend>
					<input type="radio" id="title-sort" name="sort" value="title" checked>
					<label for="title-sort">Title (A-Z)</label>
					<input type="radio" id="rating-sorted" name="sort" value="rating">
					<label for="rating-sorted">Highest Rated</label>
				</fieldset>

<!-- Submission button for submission of answers that have been given by the user. -->

				<button type="submit">Search</button>
			</form>

<!-- Advisory bar that if nothing is entered will show to inform that there will need to be a Movie entered to be able to start the actual search. -->	
<!-- https://www.w3.org/WAI/WCAG22/Techniques/aria/ARIA16 -->

			<section aria-labelledby="heading-results">
				<h2 id="heading-results">Results</h2>
				<p id="results-status" role="status">Enter A Movie Title To Start!</p>
				<ul id ="results-list"></ul>
			</section>
		</main>

<!-- Footer for reference of creator alongside where movie informationis coming from. API for TMDB and API for OMDB.-->

		<footer class="site-footer">
			<p>&copy; 2026 Josh Coates. Film data from TMDB + OMDB.</p>
		</footer>
	</body>
</html>
